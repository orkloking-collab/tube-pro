  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #07070a; color: #eef1f5; min-height: 100vh; overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.7;
    }

    /* ── 动态背景 ─────────────────────────────────────────────── */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg img {
      width: 100%; height: 100%; object-fit: cover; opacity: .72;
      transform: scale(1.1); animation: kenburns 30s ease-in-out infinite alternate;
    }
    @keyframes kenburns {
      from { transform: scale(1.10) translate3d(0, 0, 0); }
      to   { transform: scale(1.22) translate3d(-1.6%, -1.8%, 0); }
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(115% 70% at 50% 6%, rgba(7,7,10,.20), rgba(7,7,10,.92) 72%),
        linear-gradient(180deg, rgba(7,7,10,.55), rgba(7,7,10,.96));
    }

    /* ── 漂浮的 3D 海报卡片 ───────────────────────────────────── */
    .floaters {
      position: fixed; inset: 0; z-index: 1; overflow: hidden;
      perspective: 1000px; pointer-events: none;
    }
    .poster {
      position: absolute; border-radius: 14px; overflow: hidden;
      box-shadow: 0 26px 70px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
      will-change: transform;
    }
    .poster img { display: block; width: 100%; height: auto; }
    .p1 { width: 36vmin;  max-width: 250px; left: -7vmin;  top: 12vh;  opacity: .55; animation: drift1 26s ease-in-out infinite; }
    .p2 { width: 42vmin;  max-width: 290px; right: -9vmin; top: 34vh;  opacity: .60; animation: drift2 33s ease-in-out infinite; }
    .p3 { width: 32vmin;  max-width: 220px; left: 10vw;    bottom: -7vh; opacity: .34; animation: drift3 39s ease-in-out infinite; }
    @keyframes drift1 {
      0%,100% { transform: rotate3d(1, 1, 0, 13deg)  translate3d(0, 0, 0); }
      50%     { transform: rotate3d(1, 1, 0, 7deg)   translate3d(2vw, -3.5vh, 45px); }
    }
    @keyframes drift2 {
      0%,100% { transform: rotate3d(1, -1, 0, -11deg) translate3d(0, 0, 0); }
      50%     { transform: rotate3d(1, -1, 0, -4deg)  translate3d(-2.4vw, 3vh, 60px); }
    }
    @keyframes drift3 {
      0%,100% { transform: rotate3d(1, 0.5, 0, 9deg)  translate3d(0, 0, 0) scale(1); }
      50%     { transform: rotate3d(1, 0.5, 0, 3deg)  translate3d(3vw, -2vh, 20px) scale(1.05); }
    }
    @media (min-width: 820px) {
      .p1 { left: 3vw; }  .p2 { right: 3vw; }  .p3 { left: 22vw; opacity: .28; }
    }

    /* ── 光线扫过 + 粒子 ──────────────────────────────────────── */
    .sweep { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .sweep::before {
      content: ''; position: absolute; top: -50%; left: -70%; width: 55%; height: 200%;
      background: linear-gradient(75deg, transparent, rgba(255,70,95,.13), transparent);
      animation: sweep 10s linear infinite;
    }
    @keyframes sweep { 0% { transform: translateX(-30vw) rotate(12deg); } 100% { transform: translateX(170vw) rotate(12deg); } }

    .sparks { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -6vh; width: 5px; height: 5px; border-radius: 50%;
      background: #ff5a6e; box-shadow: 0 0 14px 4px rgba(255,70,90,.5); opacity: 0;
      animation: rise 13s linear infinite;
    }
    .spark:nth-child(1) { left: 9%;  animation-duration: 12s; animation-delay: 0s; }
    .spark:nth-child(2) { left: 22%; animation-duration: 16s; animation-delay: 2.5s; }
    .spark:nth-child(3) { left: 37%; animation-duration: 11s; animation-delay: 5s; }
    .spark:nth-child(4) { left: 52%; animation-duration: 15s; animation-delay: 1.4s; }
    .spark:nth-child(5) { left: 66%; animation-duration: 13s; animation-delay: 4.2s; }
    .spark:nth-child(6) { left: 79%; animation-duration: 18s; animation-delay: 6.5s; }
    .spark:nth-child(7) { left: 91%; animation-duration: 14s; animation-delay: 3.2s; }
    @keyframes rise {
      0%   { transform: translateY(0) scale(.5);      opacity: 0; }
      15%  { opacity: .65; }
      85%  { opacity: .35; }
      100% { transform: translateY(-92vh) scale(1.15); opacity: 0; }
    }

    /* ── 内容 ─────────────────────────────────────────────────── */
    .wrap {
      position: relative; z-index: 2; max-width: 620px; margin: 0 auto;
      padding: 16px 18px 34px; min-height: 100vh; display: flex; flex-direction: column;
    }
    .topbar { display: flex; align-items: center; gap: 11px; padding-top: 4px; }
    .brandlogo {
      width: 42px; height: 42px; border-radius: 13px; display: block;
      box-shadow: 0 8px 22px rgba(229,9,20,.38);
    }
    .brandname { font-size: 17.5px; font-weight: 800; letter-spacing: .2px; }
    .brandname i { font-style: normal; background: linear-gradient(180deg,#fff,#ff6b7a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lang { margin-left: auto; display: flex; gap: 6px; }
    .lang a {
      font-size: 12.5px; padding: 5px 11px; border-radius: 20px; text-decoration: none;
      color: #98a2b0; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04);
    }
    .lang a.on { background: #e50914; border-color: #e50914; color: #fff; font-weight: 700; }

    .hero { margin: auto 0; text-align: center; padding: 30px 0 22px; }
    .hero h1 {
      margin: 0 0 8px; font-size: clamp(40px, 13.5vw, 68px); font-weight: 900; letter-spacing: -1.5px; line-height: 1.02;
      background: linear-gradient(180deg, #ffffff 30%, #ffb3bb 68%, #ff4d5e);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 8px 26px rgba(229,9,20,.38));
    }
    .tag {
      margin: 0 0 14px; font-size: 13px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: #ffd0d6;
    }
    .sub { margin: 0 auto 28px; max-width: 30em; color: #b6bfca; font-size: 15px; }

    .cta { display: grid; gap: 12px; }
    .btn {
      position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 18px; border: 0; border-radius: 16px; font-size: 16.5px; font-weight: 800;
      text-decoration: none; color: #fff; cursor: pointer; overflow: hidden;
      transition: transform .12s ease, box-shadow .25s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .btn-tg {
      background: linear-gradient(135deg, #2AABEE, #229ED9 55%, #1a7fc6);
      box-shadow: 0 14px 34px rgba(34,158,217,.40), inset 0 1px 0 rgba(255,255,255,.28);
    }
    .btn-tg::after {
      content: ''; position: absolute; top: 0; left: -140%; width: 55%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent);
      animation: shine 3.6s ease-in-out infinite;
    }
    @keyframes shine { 0% { left: -140%; } 60%, 100% { left: 165%; } }
    .btn-2 {
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.17);
      backdrop-filter: blur(7px); font-weight: 700; font-size: 15.5px; color: #e7ecf3;
    }

    /* ── 18+ 赞助按钮 ─────────────────────────────────────────── */
    .adzone { margin-top: 26px; text-align: center; }
    .ad18 {
      position: relative; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 15px 18px; border-radius: 16px; text-decoration: none; color: #fff;
      font-size: 16px; font-weight: 900; letter-spacing: .2px;
      background: linear-gradient(135deg, #ff2d55, #ff5e3a 52%, #ff2d55);
      box-shadow: 0 14px 36px rgba(255,45,85,.38), inset 0 1px 0 rgba(255,255,255,.3);
      animation: pulse 2.8s ease-in-out infinite;
    }
    .ad18:active { transform: scale(.98); }
    @keyframes pulse {
      0%,100% { box-shadow: 0 14px 36px rgba(255,45,85,.34), inset 0 1px 0 rgba(255,255,255,.3); }
      50%     { box-shadow: 0 18px 48px rgba(255,45,85,.62), inset 0 1px 0 rgba(255,255,255,.3); }
    }
    .badge18 {
      display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,.34); border: 1.5px solid rgba(255,255,255,.55);
      font-size: 13px; font-weight: 900; letter-spacing: -.3px;
    }
    .adcheat {
      position: absolute; top: -8px; right: 12px; font-size: 9.5px; font-weight: 800; letter-spacing: .1em;
      background: #0f1020; color: #ccd3dd; border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px; padding: 2px 6px; text-transform: uppercase;
    }
    .adnote { margin: 11px 0 0; font-size: 11.5px; color: #8b93a1; line-height: 1.6; }

    /* ── 广告容器 ─────────────────────────────────────────────── */
    .ad-native { margin: 22px 0 0; text-align: center; }
    .ad-wide {
      margin: 20px 0 4px; display: flex; justify-content: center;
      overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    }
    .ad-wide > * { flex: 0 0 auto; }

    footer {
      margin-top: 26px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.08);
      color: #6f7784; font-size: 11.5px; text-align: center;
    }
    #pollBox { display: none; margin-top: 20px; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  })();
