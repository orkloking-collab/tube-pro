<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting...</title>

  <!-- JS বন্ধ থাকলে এই meta refresh ব্যাকআপ রিডাইরেক্ট কাজ করবে -->
  <noscript>
    <meta http-equiv="refresh" content="1; url=https://www.profitableratecpmnetwork.com/a3dhs8jh?key=efc1566522d6b3afe8f44808f822a7f9">
  </noscript>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container { padding: 20px; }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: #e50914;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-size: 22px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    p { color: #8b949e; font-size: 14px; }
    .btn {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 22px;
      background: #e50914;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="spinner"></div>
    <h2>All Video Loading...</h2>
    <p>Please wait, preparing your media link...</p>
    <a id="goLink" class="btn" href="#" rel="noopener">এখানে ক্লিক করুন</a>
  </div>

  <script type="text/javascript">
    (function () {
      "use strict";

      // ⚠️ শুধু এই একলাইনে লিংক বদলাবেন — বাকি কোড ছুঁতে হবে না
      var AD_LINK = "https://www.profitableratecpmnetwork.com/a3dhs8jh?key=efc1566522d6b3afe8f44808f822a7f9";
      var DELAY_MS = 1000; // কত মিলিসেকেন্ড পরে অটো রিডাইরেক্ট হবে

      var link = document.getElementById("goLink");
      link.href = AD_LINK;

      // টেস্ট করার জন্য: পেজের URL-এর শেষে ?preview=1 দিলে রিডাইরেক্ট বন্ধ থাকবে
      if (/[?&]preview=1/.test(location.search)) {
        document.querySelector("h2").textContent = "Preview mode (redirect off)";
        return;
      }

      // replace() ব্যবহার করা হয়েছে, তাই ফোনের back বাটনে এই পেজে আটকে থাকবে না
      function go() { window.location.replace(AD_LINK); }

      var timer = setTimeout(go, DELAY_MS);

      // ইউজার আগেই ক্লিক করলে সাথে সাথে চলে যাবে
      document.addEventListener("click", function (e) {
        e.preventDefault();
        clearTimeout(timer);
        go();
      });
    })();
  </script>

</body>
</html>
